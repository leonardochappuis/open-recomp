[workspace]
resolver = "2"
members = ["crates/orc-env", "crates/orc-kb", "crates/orc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/leonardochappuis/open-recomp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
orc-env = { path = "crates/orc-env" }
orc-kb = { path = "crates/orc-kb" }

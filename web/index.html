<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>open-recomp</title>
    <meta name="description" content="Live view of console recompilation work: what is being worked on, findings, and games." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Follow the OS theme; dark is the default.
      try {
        if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

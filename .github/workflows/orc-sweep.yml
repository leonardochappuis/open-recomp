name: orc sweep

# Hourly: remind owners of attempts whose lease is nearly over, label expired
# attempts, close attempts whose grace period ended. See docs/DESIGN.md.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would happen
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: orc-sweep

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p orc
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          ./target/release/orc sweep --repo "$GITHUB_REPOSITORY" "${args[@]}"
